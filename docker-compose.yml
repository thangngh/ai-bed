version: '3.8'
services:
  engine:
    build:
      context: ./Engine
      dockerfile: Dockerfile
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    env_file:
      - ./Engine/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    env_file:
      - ./BE/.env
    environment:
      # BE/.env holds the host-development value (localhost:8000), which inside
      # this container points at the container itself. `environment` wins over
      # `env_file`, so the compose stack reaches the Engine by service name.
      ENGINE_URL: http://engine:8000
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - be-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  be-data:
