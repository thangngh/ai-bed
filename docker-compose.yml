services:
  engine:
    build:
      context: ./Engine
      dockerfile: Dockerfile
    # No `ports`. The Engine has no rate limit of its own, so a published
    # 8000 was a way to reach /generate past nginx's per-IP limit and past
    # the BE's per-tenant one -- i.e. to spend the whole LLM budget directly.
    # It is reachable as `engine:8000` from the compose network only; the
    # single door into the stack is the frontend's port 80.
    expose:
      - "8000"
    env_file:
      - ./Engine/.env
    environment:
      # Provider credentials and endpoint come from Engine/.env. This keeps a
      # paid OpenAI-compatible API usable in the base stack without publishing
      # the Engine. The optional 9router HA overlay may still override the URL
      # with its internal balancer service when explicitly enabled.
      # Whole-generation deadline. Must stay below the BE's ENGINE_TIMEOUT_MS
      # so a slow run degrades to a fallback story instead of a 502.
      PIPELINE_BUDGET_SECONDS: ${PIPELINE_BUDGET_SECONDS:-45}
      # Round-robin the entry point into the provider chain. Off by default;
      # see .env.example for when it earns its keep.
      LLM_ROTATE: ${LLM_ROTATE:-}
      # Streaming is on in the client by default (a proxy that ignores it
      # still works). These are here to be turned down, not up: set
      # CUSTOM_LLM_STREAM=false only for a proxy that mishandles `stream: true`
      # outright rather than ignoring it.
      CUSTOM_LLM_STREAM: ${CUSTOM_LLM_STREAM:-}
      CUSTOM_LLM_STREAM_IDLE_SECONDS: ${CUSTOM_LLM_STREAM_IDLE_SECONDS:-}
      # Must match the backend's. Unset means /generate is open to anything
      # on this network -- see require_engine_key in Engine/main.py.
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
    restart: unless-stopped
    # Nothing in the Engine writes to disk, so the whole filesystem can be
    # read-only; /tmp is the one path a Python process still needs.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      # Stops a process inside from gaining privileges via setuid binaries --
      # the step an exploit takes after it has code execution, not before.
      - no-new-privileges:true
    # A ceiling, not a reservation. Without one, a request flood in any single
    # container exhausts the host and takes the other two down with it.
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      # raise_for_status matters: httpx.get alone returns for a 500 as happily
      # as for a 200, so the check would pass on a broken Engine.
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      isolated:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-ai-bed}-engine
      ai-bed_default:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-ai-bed}-engine

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_bed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}
      POSTGRES_DB: ai_bed
    # Bound to loopback only: this lets `npm run migration:run` and the
    # one-shot copy script connect from the host during development without
    # publishing the DB to the LAN/internet, matching the posture the backend
    # and engine services already use (see the `expose`-only comment below).
    # Host port 5434, not 5432/5433: both were already bound by other
    # unrelated local dev containers on this host.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_bed -d ai_bed"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    # No `ports` either: nginx proxies /api/ to `backend:3001` inside the
    # network, and that hop is where the per-IP rate limit is applied. A
    # published 3001 skipped it.
    expose:
      - "3001"
    env_file:
      - ./BE/.env
    environment:
      # BE/.env holds the host-development value (localhost:8000), which inside
      # this container points at the container itself. `environment` wins over
      # `env_file`, so the compose stack reaches the Engine by service name.
      # `engine` is not unique when another Compose project from this repo is
      # attached to the shared external networks (for example the isolated
      # test stack). Docker DNS then returns either container at random. A
      # project-qualified alias keeps each BE pinned to its own Engine.
      ENGINE_URL: http://${COMPOSE_PROJECT_NAME:-ai-bed}-engine:8000
      ENGINE_TIMEOUT_MS: ${ENGINE_TIMEOUT_MS:-60000}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      # Same override reasoning as ENGINE_URL above: BE/.env's DATABASE_URL is
      # the host-development value (localhost, port per the postgres service's
      # `ports:` entry above); inside the compose network the core datasource
      # reaches Postgres by service name.
      DATABASE_URL: postgresql://ai_bed:${POSTGRES_PASSWORD}@postgres:5432/ai_bed
    depends_on:
      engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Not read_only: SQLite needs to write its database and its -wal/-shm
    # sidecars into the mounted volume.
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - be-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    # The one and only published port in the stack. Everything else is reachable
    # by service name on the compose network and nowhere else, so this is the
    # single door: every request pays nginx's per-IP rate limit, and there is no
    # path to the Engine's LLM budget that skips it.
    #
    # Container-side 8080 because the image is nginx-unprivileged and its worker
    # cannot bind a privileged port; the host side is still 80.
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      # Checks the proxy hop as well as the SPA shell: a frontend that serves
      # index.html but cannot reach the BE is not usable.
      #
      # 127.0.0.1, not localhost: the image's 10-listen-on-ipv6-by-default.sh
      # cannot patch default.conf (it is not writable by the nginx user), so
      # nginx listens on IPv4 only -- while busybox wget tries ::1 first and
      # the check failed with "connection refused" against a healthy proxy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  be-data:
  pg-data:

networks:
  isolated:
    name: ai-bed-isolated_default
    external: true
  ai-bed_default:
    external: true
