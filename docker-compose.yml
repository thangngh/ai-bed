version: '3.8'
services:
  engine:
    build:
      context: ./Engine
      dockerfile: Dockerfile
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    env_file:
      - ./Engine/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    env_file:
      - ./BE/.env
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - be-data:/app/data

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  be-data: