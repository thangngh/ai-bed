# Round-robin across the 9router replicas, with failover.
#
# Timeouts are deliberately long: reasoning models behind opencode zen have
# been measured at up to ~300s for a single writer call, and cutting the
# connection early turns a slow-but-good story into an Engine fallback.

upstream ninerouter {
    server 9router-a:20128 max_fails=2 fail_timeout=30s;
    server 9router-b:20128 max_fails=2 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 20128;

    # Surface which replica served the request so the identity probe and the
    # integration test can attribute rate-limit errors to a specific replica.
    add_header X-9Router-Upstream $upstream_addr always;

    location / {
        proxy_pass http://ninerouter;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Streaming (SSE) must not be buffered or the Engine sees the whole
        # body at once and long generations look like a stall.
        proxy_buffering off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 30s;
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;

        # Move to the next replica when one is down or rate-limited.
        proxy_next_upstream error timeout http_429 http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
