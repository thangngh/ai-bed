# Cloudflare Tunnel terminates the connection and `cloudflared` re-originates
# it from inside the compose network, so $remote_addr is the tunnel container's
# 172.x address for every visitor on earth -- one shared bucket, which both
# locks out honest users and rate-limits an attacker not at all. CF-Connecting-IP
# carries the real client, and is only trusted from the compose network: the
# published port is 80 on the frontend, and a client arriving there directly is
# not in 172.16.0.0/12, so it cannot forge the header into being believed.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Per-IP request rate at the edge. Concrete limits in docs/10: 10 requests
# per minute per IP, burst 20, reject with 429 + Retry-After. Only /api/ pays
# for this; the SPA shell is served without a rate limit.
#
# This is the layer that actually binds: the BE's own limiter is keyed by the
# self-asserted X-Tenant-Id, which a caller can rotate at will.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/m;
limit_req_status 429;

# A 429 without Retry-After tells a client it was throttled but not for how
# long, so the only strategy left is to guess -- and a client that guesses
# short turns one rejection into a retry storm. nginx has no directive for
# this, and `add_header` cannot be made conditional, so the value is routed
# through a map: nginx omits a header whose value is the empty string, which
# keeps Retry-After off the other 25 responses in a burst.
#
# 60 matches the zone's 10r/m window: a client that waits that long has its
# whole allowance back.
map $status $retry_after_seconds {
    429     "60";
    default "";
}

server {
    # 8080, not 80: the image is nginx-unprivileged and the worker runs as an
    # unprivileged uid, which cannot bind a port below 1024. The published host
    # port is still 80 -- compose maps 80:8080 -- so this is invisible from
    # outside and buys a container that is not root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The version banner tells a scanner which nginx to look up CVEs for and
    # buys nothing in return.
    server_tokens off;

    # Security headers. `always` matters: without it nginx omits them on error
    # responses, and a 429 or a 502 is rendered in the same browser as a 200.
    #
    # The CSP is the load-bearing one. Story text is written by an LLM from
    # parent-supplied input, so it is untrusted content by construction; React
    # escapes it on the way into the DOM, and this is the layer that holds if
    # that ever stops being true. 'unsafe-inline' for styles only -- Tailwind's
    # build output and the inline style attributes the SPA sets need it, while
    # scripts stay strict, which is where an injection would have to land.
    # connect-src is 'self' because the SPA talks to /api/ on this same origin
    # and nowhere else; that is what makes an injected exfiltration call fail.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No feature this app has needs any of these, and a child's device is the
    # worst place to leave them available to injected script.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # Empty on every status except 429, and an empty add_header is not sent.
    add_header Retry-After $retry_after_seconds always;
    # HSTS is deliberately absent: this server speaks plain HTTP and is meant to
    # sit behind a TLS terminator (Cloudflare Tunnel, or a reverse proxy).
    # Sending HSTS from here would pin browsers to https:// for an origin that
    # may not serve it yet -- add it at the terminator, where it is true.

    # The admin console has its own application login, but Basic Auth here is
    # an independent edge gate. Protect both the SPA route and its API so the
    # latter cannot be reached by skipping the browser UI.
    location = /admin {
        auth_basic "AI Bed Admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        try_files $uri /index.html;
    }

    location ^~ /admin/ {
        auth_basic "AI Bed Admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/admin/ {
        auth_basic "AI Bed Admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        limit_req zone=per_ip burst=20 nodelay;
        proxy_pass http://backend:3001/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    # The SPA calls `/api/story/create`, the BE serves `/story/create`.
    # The trailing slash on both `location` and `proxy_pass` is what strips the
    # `/api` prefix -- without it every call reaches NestJS as a 404.
    location /api/ {
        limit_req zone=per_ip burst=20 nodelay;
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Story generation is Engine -> LLM bound; BE's own deadline
        # (ENGINE_TIMEOUT_MS) plus queue wait can exceed two minutes, so nginx
        # must not be the one to give up first. This ceiling is what
        # PIPELINE_BUDGET_SECONDS is sized against -- see the timeout table in
        # the README.
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    # The version segment in each filename (`-v12-`) is what makes `immutable`
    # safe: a new font release means a new name, never an overwrite of a file
    # already cached by a client. Files under public/ bypass Vite's content
    # hashing, so this rule is the only cache policy they get.
    location /fonts/ {
        # `add_header` in a location *replaces* the inherited set rather than
        # adding to it, so every header the server block declares has to be
        # repeated here or font requests would be served bare. nosniff is the
        # one that matters for a static asset: it is what stops a font URL from
        # being talked into executing as script.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: every unknown path is a client-side route, serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
