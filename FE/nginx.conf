server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA calls `/api/story/create`, the BE serves `/story/create`.
    # The trailing slash on both `location` and `proxy_pass` is what strips the
    # `/api` prefix -- without it every call reaches NestJS as a 404.
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Story generation is Engine -> LLM bound; BE's own deadline
        # (ENGINE_TIMEOUT_MS) plus queue wait can exceed a minute, so nginx must
        # not be the one to give up first.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA: every unknown path is a client-side route, serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
